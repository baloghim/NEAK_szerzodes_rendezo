name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          architecture: x64
          cache: pip
      - name: Build, test and run packaged EXE
        shell: pwsh
        run: |
          try {
            ./scripts/build-windows.ps1 *>&1 | Tee-Object -FilePath build.log
          } catch {
            $details = ((Get-Content build.log -Tail 30 -ErrorAction SilentlyContinue) -join "`n") + "`n" + $_.ToString()
            $escaped = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows build diagnostics::$escaped"
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/*.zip --title "Otthonápolási szerződéskezelő $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md
